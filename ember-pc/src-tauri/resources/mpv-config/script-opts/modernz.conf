# ModernZ, styled for Ember (Disney+ / Apple TV feel): title top left, a clean bar at the bottom, warm accent
# Top: the title, large, over a soft fade; no window buttons
window_top_bar=yes
show_window_title=yes
window_title_font_size=30
window_controls=no
window_title_color=#FFFFFF
title=${media-title}
show_title=no
# Bottom bar
layout=default
seekbar_height=small
seekbarfg_color=#F0A04B
seekbarbg_color=#5A4636
seekbar_cache_color=#8A7462
seek_handle_color=#F0A04B
seek_handle_border_color=disable
nibble_color=#F0A04B
hover_effect=glow,color
hover_effect_color=#F0A04B
playpause_size=36
midbuttons_size=28
sidebuttons_size=24
time_font_size=17
jump_buttons=yes
jump_amount=10
track_nextprev_buttons=no
playlist_button=no
download_button=no
screenshot_button=no
ontop_button=no
loop_button=no
info_button=no
speed_button=no
cache_info=no
fullscreen_button=yes
volume_control=yes
# Behaviour
showonpause=yes
keeponpause=both
hidetimeout=2200
fadeduration=250
osc_on_start=both
idlescreen=no
osc_fade_strength=100
