# Ember's player settings (the app passes the rest)
# picture: mpv's high-quality scaling (sharper upscaling, proper dithering), but no debanding (it softens),
# HDR handed to Windows as HDR when the screen is in HDR mode (as Stremio does), and when it isn't,
# a tone-mapping that keeps contrast instead of the flat, washed-out look
profile=high-quality
deband=no
target-colorspace-hint=yes
tone-mapping=bt.2446a
hdr-contrast-recovery=0.30
osc=no
osd-bar=no
border=no
keep-open=no
osd-font="Segoe UI Variable Display"
osd-font-size=34
osd-color="#F3E7DA"
osd-border-color="#AA000000"
osd-border-size=1.5
osd-shadow-offset=1
osd-margin-x=60
osd-margin-y=60
# subtitles: clean, readable, like the streaming apps
sub-font="Segoe UI Variable Display"
sub-font-size=44
sub-color="#FFFFFF"
sub-border-color="#E6000000"
sub-border-size=2.4
sub-shadow-offset=1.2
sub-shadow-color="#80000000"
sub-margin-y=48
sub-ass-override=scale
# letterbox bars: jet black, like every streaming app
background=color
background-color="#000000"
