<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="glow"></div>

<nav id="side">
  <div class="logo"><span class="flame"></span>Ember</div>
  <button data-page="search" class="nav"><i>⌕</i>Search</button>
  <button data-page="home" class="nav on"><i>⌂</i>Home</button>
  <button data-page="films" class="nav"><i>▣</i>Films</button>
  <button data-page="series" class="nav"><i>▤</i>Series</button>
  <button data-page="match" class="nav"><i>♥</i>What to watch?</button>
  <button data-page="year" class="nav"><i>★</i>Your year</button>
  <button data-page="apps" class="nav tv-only"><i>▦</i>Apps</button>
  <div class="grow"></div>
  <button data-page="settings" class="nav"><i>⚙</i>Settings</button>
</nav>

<main id="view"></main>
<button id="fullscreen" title="Full screen (F11)" aria-label="Full screen">⛶</button>

<div id="loader" hidden>
  <div class="ld-bg"></div><div class="ld-shade"></div>
  <div class="ld-box">
    <div class="ld-title"></div>
    <div class="ld-flame"><i></i><b></b></div>
    <div class="ld-steps"></div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-note"></div>
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="tv.js"></script>
</body>
</html>
