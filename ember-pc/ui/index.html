<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="glow"></div>
<canvas id="sky"></canvas>  <!-- the moving sky draws over the glow -->

<nav id="side">
  <div class="logo"><span class="flame"></span>Ember</div>
  <button data-page="search" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></i>Search</button>
  <button data-page="home" class="nav on"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/></svg></i>Home</button>
  <button data-page="films" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7.5 4.5v15M16.5 4.5v15M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21"/></svg></i>Films</button>
  <button data-page="series" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="12" rx="2.5"/><path d="M8.5 21h7M12 17.5V21"/><path d="M10.5 9.2v4.6l4-2.3z" class="fill"/></svg></i>Series</button>
  <button data-page="match" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></i>What to watch?</button>
  <button data-page="year" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></i>Your year</button>
  <button data-page="apps" class="nav tv-only"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></i>Apps</button>
  <div class="grow"></div>
  <button data-page="settings" class="nav"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></i>Settings</button>
</nav>

<main id="view"></main>
<button id="fullscreen" title="Full screen (F11)" aria-label="Full screen">⛶</button>

<div id="loader" hidden>
  <div class="ld-bg"></div><div class="ld-shade"></div>
  <div class="ld-box">
    <div class="ld-title"></div>
    <div class="ld-flame"><i></i><b></b></div>
    <div class="ld-steps"></div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-note"></div>
    <button class="btn ld-cancel" id="ldCancel">Cancel</button>
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="tv.js"></script>
</body>
</html>
