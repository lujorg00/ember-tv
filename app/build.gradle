plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lucamedia.ember'
    compileSdk 35

    defaultConfig {
        applicationId 'org.lucamedia.ember'
        minSdk 26
        targetSdk 34
        // CI sets these from the build number so every build installs over the last one.
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        ember {
            storeFile rootProject.file('keystore/ember.keystore')
            storePassword 'emberember'
            keyAlias 'ember'
            keyPassword 'emberember'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ember
        }
        debug {
            signingConfig signingConfigs.ember
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // The same interface as Ember PC: ember-pc/ui is bundled into the app and shown full screen.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../ember-pc/ui']
        }
    }
}

dependencies {
    // The player: Google's Media3 (ExoPlayer), made for Android TV - 4K, HDR, Dolby Vision, passthrough, subtitles
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
